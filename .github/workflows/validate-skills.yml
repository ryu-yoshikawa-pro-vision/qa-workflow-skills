name: Validate Agent Skills

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install official skills-ref
        run: >-
          python -m pip install
          "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validate Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            test -f "$skill/SKILL.md"
            skills-ref validate "$skill"
          done

      - name: Validate repository eval structure
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          skill_root = Path("skills")
          actual = sorted(
              p.name for p in skill_root.iterdir()
              if p.is_dir() and (p / "SKILL.md").is_file()
          )
          assert actual, "no canonical Skill packages found"
          expected = actual

          names = []
          total_queries = 0

          for name in expected:
              skill_file = skill_root / name / "SKILL.md"
              text = skill_file.read_text(encoding="utf-8")
              assert text.startswith("---\n"), skill_file
              parts = text.split("---", 2)
              assert len(parts) == 3, skill_file
              frontmatter = parts[1]

              name_match = re.search(r"^name:\s*(.+?)\s*$", frontmatter, re.MULTILINE)
              description_match = re.search(
                  r"^description:\s*(.+?)\s*$", frontmatter, re.MULTILINE
              )
              assert name_match, f"missing name: {skill_file}"
              assert description_match, f"missing description: {skill_file}"

              declared_name = name_match.group(1)
              description = description_match.group(1)
              assert declared_name == name, (skill_file, declared_name, name)
              assert description, f"empty description: {skill_file}"
              names.append(declared_name)

              datasets = ["train_queries.json", "validation_queries.json"]
              for filename in datasets:
                  path = skill_root / name / "evals" / "trigger" / filename
                  data = json.loads(path.read_text(encoding="utf-8"))
                  assert isinstance(data, list), path
                  assert data, f"empty trigger dataset: {path}"
                  assert all(isinstance(item, dict) for item in data), path
                  assert all(
                      isinstance(item.get("query"), str) and item["query"].strip()
                      for item in data
                  ), path
                  assert all(
                      isinstance(item.get("should_trigger"), bool)
                      for item in data
                  ), path
                  positives = sum(item["should_trigger"] is True for item in data)
                  negatives = sum(item["should_trigger"] is False for item in data)
                  assert positives > 0 and positives == negatives, (path, positives, negatives)
                  total_queries += len(data)

              train_queries = {
                  item["query"]
                  for item in json.loads(
                      (skill_root / name / "evals" / "trigger" / "train_queries.json").read_text(encoding="utf-8")
                  )
              }
              validation_queries = {
                  item["query"]
                  for item in json.loads(
                      (skill_root / name / "evals" / "trigger" / "validation_queries.json").read_text(encoding="utf-8")
                  )
              }
              assert train_queries.isdisjoint(validation_queries), (
                  name,
                  sorted(train_queries & validation_queries),
              )

          assert len(names) == len(set(names)) == len(actual), names

          readme = Path("README.md").read_text(encoding="utf-8")
          missing = [name for name in expected if f"`{name}`" not in readme]
          assert not missing, (Path("README.md"), missing)
          evals = Path("EVALS.md").read_text(encoding="utf-8")
          assert "current repository" in evals, "EVALS.md must derive the canonical Skill set from the repository"

          print(f"Skill count: {len(names)}")
          print("Trigger datasets: non-empty and balanced by current contents")
          print(f"Total trigger queries: {total_queries}")
          PY

      - name: Validate semantic dataset counts
        run: |
          python scripts/skills/evals/semantic/validate.py
          python -m unittest discover -s tests/skills/evals/semantic -v

      - name: Validate trigger dataset contract
        run: python -m unittest discover -s tests/skills/evals/trigger -v
