name: Validate Deterministic Output Evals

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deterministic-output-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic eval YAML dependency
        run: python -m pip install "PyYAML==6.0.3"

      - name: Validate output eval datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          skill_root = Path("skills")
          skills = sorted(
              path.name for path in skill_root.iterdir()
              if path.is_dir()
              and (path / "SKILL.md").is_file()
              and (path / "evals" / "output" / "evals.json").is_file()
          )
          assert skills, "no canonical Skills with output eval manifests found"
          total = 0
          for skill in skills:
              root = Path("skills") / skill / "evals" / "output"
              data = json.loads((root / "evals.json").read_text(encoding="utf-8"))
              assert data["skill"] == skill
              cases = data.get("cases", [])
              assert cases, (skill, "no deterministic output cases")
              ids = [case["id"] for case in cases]
              assert len(ids) == len(set(ids)), (skill, ids)
              for case in cases:
                  input_path = root / case["input"]
                  expected_path = root / case["expected"]
                  assert input_path.is_file(), input_path
                  assert expected_path.is_file(), expected_path
                  assert "output-template.md" in input_path.read_text(encoding="utf-8") or skill == "qa-workflow", input_path
                  assert isinstance(json.loads(expected_path.read_text(encoding="utf-8")), dict)
                  total += 1
          print(f"Canonical Skills with output evals: {len(skills)}")
          print(f"Deterministic output eval cases: {total}")
          PY

      - name: Compile deterministic grader, Skill validators, and repository tests
        run: |
          python -m compileall -q scripts/skills/evals/deterministic
          python -m compileall -q skills/*/evals/deterministic
          python -m compileall -q tests/skills/evals/deterministic

      - name: Compile runtime scripts
        run: |
          python - <<'PY'
          import compileall
          from pathlib import Path

          skill_root = Path("skills")
          packages = sorted(
              path / "scripts" for path in skill_root.iterdir()
              if path.is_dir() and (path / "SKILL.md").is_file() and (path / "scripts").is_dir()
          )
          for package in packages:
              if not compileall.compile_dir(str(package), quiet=1, force=True):
                  raise SystemExit(f"runtime script compilation failed: {package}")
          print(f"Compiled runtime scripts for {len(packages)} current Skills")
          PY

      - name: Run shared deterministic runtime unit tests
        run: python -m unittest discover -s scripts/skills/evals/deterministic/tests -v

      - name: Run repository deterministic eval tests
        run: python -m unittest discover -s tests/skills/evals/deterministic -v

      - name: Run runtime unit and integration tests
        run: python -m unittest discover -s tests/skills/runtime -p 'test_*.py' -v

      - name: Validate semantic datasets and runtime
        run: |
          python -m compileall -q scripts/skills/evals/semantic
          python -m compileall -q tests/skills/evals/semantic
          python scripts/skills/evals/semantic/validate.py
          python -m unittest discover -s scripts/skills/evals/semantic/tests -v
          python -m unittest discover -s tests/skills/evals/semantic -v
