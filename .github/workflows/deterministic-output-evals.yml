name: Validate Deterministic Output Evals

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deterministic-output-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Temporary Japanese terminology residual check
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = [Path("README.md"), Path("EVALS.md")]
          roots.extend(Path("skills").glob("*/SKILL.md"))
          roots.extend(Path("skills").glob("*/references/*.md"))
          roots.extend(Path("skills").glob("*/assets/*.md"))
          roots.extend([
              Path("scripts/skills/evals/deterministic/README.md"),
              Path("scripts/skills/evals/deterministic/ASSERTIONS.md"),
              Path("scripts/skills/evals/semantic/README.md"),
          ])

          forbidden = [
              "Current Effective Authority", "Authority ID", "Related Authority ID", "Authority conflict",
              "Canonical Registry", "Product Risk", "Project Risk", "Test Requirement", "Test Condition",
              "Coverage Criteria", "Coverage Item", "Coverage Analysis", "Low-Level Test Case", "Disposition",
              "Blocked", "Blocker", "routing", "Full Workflow", "Domain Logic", "Single Source of Truth",
              "Self-Validation", "Input Contract", "Output Contract", "Cold Review", "Oracle", "Assumption",
              "Candidate Output", "Semantic Output Eval", "Deterministic Output Eval", "Trigger Eval",
              "Spec Validation", "Workflow E2E Eval", "Decision Table", "Error Guessing",
          ]

          findings = []
          for path in sorted(set(roots)):
              if not path.is_file():
                  continue
              for lineno, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  for term in forbidden:
                      if term in line:
                          findings.append(f"{path}:{lineno}: {term}: {line}")
          if findings:
              print("\n".join(findings))
              raise SystemExit(1)
          print(f"Japanese terminology residual check: PASS ({len(set(roots))} files scanned)")
          PY

      - name: Temporary git diff check
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git diff --check FETCH_HEAD...HEAD

      - name: Validate output eval datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          skills = [
              "qa-workflow", "spec-analysis", "question-analysis", "test-analysis",
              "test-requirement-design", "test-condition-design", "test-case-design",
              "coverage-analysis", "adversarial-review",
          ]
          total = 0
          for skill in skills:
              root = Path("skills") / skill / "evals" / "output"
              data = json.loads((root / "evals.json").read_text(encoding="utf-8"))
              assert data["skill"] == skill
              cases = data.get("cases", [])
              assert len(cases) >= 2, (skill, len(cases))
              ids = [case["id"] for case in cases]
              assert len(ids) == len(set(ids)), (skill, ids)
              for case in cases:
                  input_path = root / case["input"]
                  expected_path = root / case["expected"]
                  assert input_path.is_file(), input_path
                  assert expected_path.is_file(), expected_path
                  assert "output-template.md" in input_path.read_text(encoding="utf-8") or skill == "qa-workflow", input_path
                  assert isinstance(json.loads(expected_path.read_text(encoding="utf-8")), dict)
                  total += 1
          assert total >= 18, total
          print(f"Deterministic output eval cases: {total}")
          PY

      - name: Compile deterministic grader, Skill validators, and repository tests
        run: |
          python -m compileall -q scripts/skills/evals/deterministic
          python -m compileall -q skills/*/evals/deterministic
          python -m compileall -q tests/skills/evals/deterministic

      - name: Run shared deterministic runtime unit tests
        run: python -m unittest discover -s scripts/skills/evals/deterministic/tests -v

      - name: Run repository deterministic eval tests
        run: python -m unittest discover -s tests/skills/evals/deterministic -v
