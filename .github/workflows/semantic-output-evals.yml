name: Validate Semantic Output Evals

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  semantic-output-evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Semantic Eval runtime and repository tests
        run: |
          python -m compileall -q scripts/skills/evals/semantic
          python -m compileall -q tests/skills/evals/semantic

      - name: Validate Semantic Eval datasets
        run: python scripts/skills/evals/semantic/validate.py

      - name: Run Semantic Eval shared runtime tests
        run: python -m unittest discover -s scripts/skills/evals/semantic/tests -v

      - name: Run Semantic Eval repository tests
        run: python -m unittest discover -s tests/skills/evals/semantic -v
