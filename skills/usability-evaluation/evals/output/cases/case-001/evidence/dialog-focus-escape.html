<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API token settings fixture</title>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f3f5f9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(42rem, calc(100% - 2rem)); padding: 2rem; background: white; border-radius: .75rem; }
    button, a { font: inherit; }
    button { padding: .7rem 1rem; border: 0; border-radius: .3rem; background: #1959a8; color: white; }
    #dialog { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(20 28 43 / .48); }
    #dialog[hidden] { display: none; }
    .dialog-card { width: min(28rem, calc(100% - 2rem)); padding: 1.5rem; background: white; border-radius: .5rem; box-shadow: 0 1rem 3rem rgb(0 0 0 / .25); }
    .danger { background: #b51e1e; }
  </style>
</head>
<body>
  <main>
    <h1>API token settings</h1>
    <p>Manage tokens used by connected integrations.</p>
    <button id="open">Create API token</button>
    <p><a href="#help">Token help</a></p>
  </main>
  <section id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog-card">
      <h2 id="dialog-title">Remove API token?</h2>
      <p id="dialog-description">Removing this token stops connected integrations. You can create a replacement later.</p>
      <button class="danger">Remove API token</button>
    </div>
  </section>
  <script>
    document.querySelector('#open').addEventListener('click', () => {
      document.querySelector('#dialog').hidden = false;
      document.querySelector('.danger').focus();
    });
    document.querySelector('#dialog').hidden = false;
  </script>
</body>
</html>
