<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Container query observation fixture</title>
    <style>
      body {
        margin: 0;
      }
      .container {
        container-type: inline-size;
        width: min(80vw, 500px);
      }
      #same-value {
        color: red;
      }
      @container (min-width: 400px) {
        #same-value {
          color: red;
        }
      }
      @container style(--variant: promoted) {
        #style-query-sentinel {
          outline-width: 3px;
        }
      }
      .named-container {
        container-name: shared-card;
      }
      @container shared-card (min-width: 250px) {
        .shared-target {
          border-width: 4px;
        }
      }
      @media (max-width: 600px) {
        #media-sentinel {
          border-width: 2px;
        }
      }
    </style>
  </head>
  <body>
    <main id="outer-container" class="container" style="--variant: promoted">
      <span id="same-value">fixed computed color</span>
      <span id="style-query-sentinel">style query target</span>
      <div class="named-container container"><span class="shared-target">one</span></div>
      <div class="named-container container"><span class="shared-target">two</span></div>
    </main>
    <div id="media-sentinel">media query target</div>
  </body>
</html>
