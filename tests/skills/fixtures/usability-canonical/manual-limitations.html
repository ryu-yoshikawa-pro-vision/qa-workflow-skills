<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual fallback fixture</title>
  <style>
    body { margin: 2rem; color: #18212b; font: 16px/1.5 Arial, sans-serif; }
    .gradient-panel { padding: 2rem; color: white; background: linear-gradient(110deg, #172554, #d97706); mix-blend-mode: normal; }
    .complex-focus:focus-visible { outline: 0; box-shadow: 0 0 0 2px #ffffff, 0 0 0 5px #7c3aed, 0 0 12px 7px rgba(0, 0, 0, .45); }
  </style>
</head>
<body>
  <h1>Visual fallback fixture</h1>
  <section class="gradient-panel" aria-labelledby="gradient-heading">
    <h2 id="gradient-heading">Text over a gradient</h2>
    <p>Manual contrast review is needed because the background is not a single resolved color.</p>
  </section>
  <p><a class="complex-focus" href="/">Complex focus appearance: return to the store fixture</a></p>
</body>
</html>
